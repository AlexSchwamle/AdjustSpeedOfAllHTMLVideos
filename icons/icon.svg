<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- White background -->
  <rect width="128" height="128" rx="16" fill="#ffffff"/>
  <!-- Play triangle -->
  <polygon points="20,12 112,64 20,116" fill="none" stroke="#222222" stroke-width="9" stroke-linejoin="round"/>
  <!-- ± symbol in gray -->
  <!-- Plus horizontal -->
  <rect x="36" y="44" width="34" height="7" rx="2" fill="#777777"/>
  <!-- Plus vertical -->
  <rect x="49.5" y="30.5" width="7" height="34" rx="2" fill="#777777"/>
  <!-- Minus bar -->
  <rect x="36" y="77" width="34" height="7" rx="2" fill="#777777"/>
</svg>
